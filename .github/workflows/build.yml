name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Use Windows to match local build behavior for backslash paths and MSBuild property functions.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    env:
      # stripped reference assemblies, regenerated with scripts/regen-refs.sh
      BONELAB_DIR: ${{ github.workspace }}/ReferenceStubs
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Stamp version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="${GITHUB_REF_NAME#v}"
          # thunderstore only accepts major.minor.patch
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::tag $GITHUB_REF_NAME isn't vX.Y.Z"
            exit 1
          fi
          sed -i -E "s/(\"version_number\": *\")[^\"]*/\1$version/" Staging/manifest.json
          sed -i -E "s/(const string Version = \")[^\"]*/\1$version/" BuildInfo.cs
          grep -q "\"$version\"" Staging/manifest.json && grep -q "\"$version\"" BuildInfo.cs

      - name: Build
        run: dotnet build BoneSnap.csproj -c Release -p:DeployToGame=false

      - uses: actions/upload-artifact@v7
        with:
          name: BoneSnap
          path: Staging/BoneSnap.zip
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: BoneSnap

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" BoneSnap.zip --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
